name: Auto sync upstream

on:
  schedule:
    - cron: '0 1 * * *'   # 每天北京时间 9 点同步
  workflow_dispatch:        # 也支持手动点按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync from upstream
        run: gh api repos/${{ github.repository }}/merge-upstream -X POST -f branch=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep workflow alive
        uses: gautamkrishnar/keepalive-workflow@v2
